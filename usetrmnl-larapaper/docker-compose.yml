services:
  app_proxy:
    environment:
      APP_HOST: usetrmnl-larapaper_app_1
      APP_PORT: 8080
      PROXY_AUTH_WHITELIST: "/api/*,/storage/*"

  app:
    image: ghcr.io/usetrmnl/larapaper:0.45.0@sha256:5926820ead83c322d722fe01e0251cd7fb2d1cc9d043de96c70d1dcb2e07e9ac
    environment:
      - PHP_OPCACHE_ENABLE=1
      - TRMNL_PROXY_REFRESH_MINUTES=15
      - DB_DATABASE=database/storage/database.sqlite
    volumes:
      - ${APP_DATA_DIR}/data/database/:/var/www/html/database/storage
      - ${APP_DATA_DIR}/data/images/:/var/www/html/storage/app/public/images/generated
      - ${APP_DATA_DIR}/data/firmwares/:/var/www/html/storage/app/public/firmwares
    restart: on-failure